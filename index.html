<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo Rolmar · Panel</title>
<style>
  :root{
    --navy: #16234f;
    --navy-dark: #0d1730;
    --navy-soft: #eceff6;
    --line: #dde1ea;
    --bg: #f6f7f9;
    --text: #1c1f2a;
    --text-muted: #6b7280;
    --white: #ffffff;
    --radius: 10px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  header{
    background: var(--white);
    border-bottom: 1px solid var(--line);
    padding: 14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position: sticky;
    top:0;
    z-index: 10;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }

  .brand-mark{
    width:42px;
    height:42px;
    border-radius: 8px;
    background: var(--navy);
    color: var(--white);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -1px;
  }

  .brand-name{
    font-family: Georgia, "Times New Roman", serif;
    font-size: 19px;
    font-weight: 700;
    color: var(--navy);
    line-height:1.1;
  }

  .brand-sub{
    font-size: 12px;
    color: var(--text-muted);
  }

  .header-right{
    display:flex;
    align-items:center;
    gap:16px;
    font-size: 13px;
    color: var(--text-muted);
  }

  /* ---------- Mini reloj + calendario ---------- */
  .mini-clock{
    display:flex;
    align-items:center;
    gap:10px;
    background: var(--navy-soft);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12.5px;
    color: var(--navy);
    font-variant-numeric: tabular-nums;
  }

  .mini-item{
    display:flex;
    align-items:center;
    gap:5px;
    white-space: nowrap;
  }

  .mini-item svg{
    width:13px;
    height:13px;
    flex-shrink:0;
  }

  .mini-sep{
    color: var(--line);
  }

  .avatar{
    width:32px;
    height:32px;
    border-radius:50%;
    background: var(--navy-soft);
    color: var(--navy);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:600;
  }

  /* ---------- Layout ---------- */
  main{
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }

  .greeting h1{
    font-size: 22px;
    margin: 0 0 4px;
    font-weight: 600;
  }

  .greeting p{
    margin:0;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* ---------- Stats ---------- */
  .stats{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin: 24px 0 32px;
  }

  .stat-card{
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
  }

  .stat-label{
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .stat-value{
    font-size: 22px;
    font-weight: 700;
    color: var(--navy);
  }

  /* ---------- Section ---------- */
  .section-title{
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin: 0 0 12px;
  }

  .actions{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 32px;
  }

  .action-card{
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    text-align:left;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:10px;
    font-family: inherit;
    transition: border-color .15s ease;
  }

  .action-card:hover{
    border-color: var(--navy);
  }

  .action-icon{
    width:36px;
    height:36px;
    border-radius: 8px;
    background: var(--navy-soft);
    color: var(--navy);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .action-icon svg{ width:18px; height:18px; }

  .action-title{
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }

  .action-desc{
    font-size: 12px;
    color: var(--text-muted);
    line-height:1.4;
  }

  /* ---------- Activity ---------- */
  .activity{
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow:hidden;
  }

  .activity-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 13px 18px;
    font-size: 13px;
    border-bottom: 1px solid var(--line);
  }

  .activity-row:last-child{ border-bottom:none; }

  .activity-desc{ color: var(--text); }
  .activity-time{ color: var(--text-muted); font-size:12px; }

  .empty-note{
    padding: 22px 18px;
    text-align:center;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* ---------- Toast ---------- */
  .toast{
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--navy-dark);
    color: var(--white);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
  }

  .toast.show{
    opacity:1;
    transform: translateX(-50%) translateY(0);
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 720px){
    .stats{ grid-template-columns: repeat(2,1fr); }
    .actions{ grid-template-columns: 1fr; }
    .brand-sub{ display:none; }
    header{ padding: 12px 16px; }
    main{ padding: 20px 16px 48px; }
    .mini-clock{ padding: 5px 10px; gap:7px; font-size: 11.5px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">GR</div>
    <div>
      <div class="brand-name">Grupo Rolmar</div>
      <div class="brand-sub">Panel de administración</div>
    </div>
  </div>
  <div class="header-right">
    <div class="mini-clock">
      <span class="mini-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>
        <span id="miniDate"></span>
      </span>
      <span class="mini-sep">·</span>
      <span class="mini-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        <span id="miniTime"></span>
      </span>
    </div>
    <div class="avatar">A</div>
  </div>
</header>

<main>

  <div class="greeting">
    <h1 id="greetingText">Buen día</h1>
    <p>Esto es lo que pasa hoy en Grupo Rolmar.</p>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Pedidos hoy</div>
      <div class="stat-value" id="statPedidos">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Productos en catálogo</div>
      <div class="stat-value" id="statProductos">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Clientes registrados</div>
      <div class="stat-value" id="statClientes">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Ingreso de hoy</div>
      <div class="stat-value" id="statIngresos">–</div>
    </div>
  </div>

  <div class="section-title">Acciones rápidas</div>
  <div class="actions">

    <button class="action-card" data-action="Actualizar catálogo" data-href="catalogo.html">
      <div class="action-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </div>
      <div class="action-title">Actualizar catálogo</div>
      <div class="action-desc">Agrega, edita o quita edredones, almohadas y otros productos.</div>
    </button>

    <button class="action-card" data-action="Enviar notificación" data-href="notificaciones.html">
      <div class="action-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
      </div>
      <div class="action-title">Enviar notificación</div>
      <div class="action-desc">Avisa a tus clientes sobre nuevos productos u ofertas.</div>
    </button>

    <button class="action-card" data-action="Ver pedidos" data-href="pedidos.html">
      <div class="action-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2l1 4M18 2l-1 4"/><path d="M3 6h18l-1.5 12.5a2 2 0 01-2 1.5H6.5a2 2 0 01-2-1.5L3 6z"/></svg>
      </div>
      <div class="action-title">Ver pedidos</div>
      <div class="action-desc">Revisa y da seguimiento a los pedidos de tus clientes.</div>
    </button>

    <button class="action-card" data-action="Clientes" data-href="clientes.html">
      <div class="action-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/><circle cx="17.5" cy="8.5" r="2.5"/><path d="M15.5 13.6c2.7.5 4.7 2.8 4.7 5.6"/></svg>
      </div>
      <div class="action-title">Clientes</div>
      <div class="action-desc">Consulta el listado de clientes y su historial de compras.</div>
    </button>

    <button class="action-card" data-action="Reportes" data-href="reportes.html">
      <div class="action-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M11 20V4M18 20v-7"/></svg>
      </div>
      <div class="action-title">Reportes</div>
      <div class="action-desc">Ve las ventas y el rendimiento del catálogo.</div>
    </button>

    <button class="action-card" data-action="Configuración" data-href="configuracion.html">
      <div class="action-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
      </div>
      <div class="action-title">Configuración</div>
      <div class="action-desc">Ajusta los datos de la tienda y las preferencias del sistema.</div>
    </button>

  </div>

  <div class="section-title">Actividad reciente</div>
  <div class="activity">
    <div class="empty-note">Todavía no hay actividad. Cuando agregues productos o llegue un pedido, lo verás aquí.</div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
  // ---------- Reloj y calendario en el header ----------
  function actualizarReloj() {
    const ahora = new Date();
    document.getElementById('miniDate').textContent = ahora.toLocaleDateString('es-GT', { weekday: 'short', day: 'numeric', month: 'short' });
    document.getElementById('miniTime').textContent = ahora.toLocaleTimeString('es-GT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  actualizarReloj();
  setInterval(actualizarReloj, 1000);

  // ---------- Saludo según la hora del día ----------
  function actualizarSaludo() {
    const hora = new Date().getHours();
    let saludo;
    if (hora >= 5 && hora < 12) saludo = 'Buenos días';
    else if (hora >= 12 && hora < 19) saludo = 'Buenas tardes';
    else saludo = 'Buenas noches';
    document.getElementById('greetingText').textContent = saludo;
  }
  actualizarSaludo();

  // ---------- Estadísticas en vivo ----------
  function esHoy(timestamp) {
    if (!timestamp) return false;
    const hoy = new Date();
    const fecha = new Date(timestamp);
    return fecha.getFullYear() === hoy.getFullYear() &&
           fecha.getMonth() === hoy.getMonth() &&
           fecha.getDate() === hoy.getDate();
  }

  async function cargarEstadisticas() {
    // Productos en catálogo
    try {
      const res = await fetch('/.netlify/functions/catalog');
      const productos = await res.json();
      document.getElementById('statProductos').textContent = Array.isArray(productos) ? productos.length : 0;
    } catch (err) {
      document.getElementById('statProductos').textContent = '0';
    }

    // Clientes registrados
    try {
      const res = await fetch('/.netlify/functions/clients');
      const clientes = await res.json();
      document.getElementById('statClientes').textContent = Array.isArray(clientes) ? clientes.length : 0;
    } catch (err) {
      document.getElementById('statClientes').textContent = '0';
    }

    // Pedidos de hoy e ingreso de hoy
    try {
      const res = await fetch('/.netlify/functions/orders');
      const pedidos = await res.json();
      const pedidosDeHoy = Array.isArray(pedidos) ? pedidos.filter(p => esHoy(p.createdAt)) : [];

      document.getElementById('statPedidos').textContent = pedidosDeHoy.length;

      // Ingreso de hoy: solo se cuenta lo que ya está vendido de verdad,
      // es decir, se excluyen los pedidos cancelados.
      const ingresoHoy = pedidosDeHoy
        .filter(p => p.status !== 'cancelado')
        .reduce((suma, p) => suma + (Number(p.total) || 0), 0);

      document.getElementById('statIngresos').textContent = 'Q ' + ingresoHoy.toLocaleString('es-GT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    } catch (err) {
      document.getElementById('statPedidos').textContent = '0';
      document.getElementById('statIngresos').textContent = 'Q 0.00';
    }
  }
  cargarEstadisticas();

  // ---------- Acciones rápidas: las que tienen data-href navegan a su pantalla ----------
  const toast = document.getElementById('toast');
  let toastTimer;

  document.querySelectorAll('.action-card').forEach(card => {
    card.addEventListener('click', () => {
      if (card.dataset.href) {
        window.location.href = card.dataset.href;
        return;
      }
      const label = card.dataset.action;
      toast.textContent = label + ' — esta sección se conectará próximamente';
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    });
  });
</script>

</body>
</html>
